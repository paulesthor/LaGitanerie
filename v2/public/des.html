<!DOCTYPE html>
<html lang="fr"><head>
  <meta charset="UTF-8">
  <style id="gita-early-bg">html{background:#243242}</style>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#243242">
  <title>Dés — La Gitanerie</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&amp;family=Playfair+Display:wght@700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/main.css">
  <script src="/js/i18n.js"></script>
  <style>
    .dice-page { flex: 1; display: flex; flex-direction: column; gap: 16px; }

    /* ── Le tapis ──
       Perspective réelle : les dés sont de vrais cubes qui tournent sur trois
       axes, pas des carrés qu'on fait pivoter à plat. */
    .dice-board {
      flex: 1;
      position: relative;
      min-height: 44vh;
      border-radius: var(--radius);
      background:
        radial-gradient(120% 80% at 50% 0%, rgba(255,255,255,.035), transparent 70%),
        var(--bg-card);
      border: 1px solid var(--border);
      overflow: hidden;
      perspective: 900px;
      perspective-origin: 50% 42%;
      touch-action: manipulation;
    }
    .dice-empty {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted); font-size: .9rem; text-align: center; padding: 20px;
      pointer-events: none;
    }

    /* Chaque dé est positionné par le moteur : on ne met AUCUNE transition CSS,
       sinon elle entrerait en conflit avec les transformations calculées à
       chaque image. */
    .die {
      position: absolute;
      top: 0; left: 0;
      transform-style: preserve-3d;
      will-change: transform;
    }
    .face {
      position: absolute; inset: 0;
      border-radius: 8%;
      background: linear-gradient(158deg, #fff 0%, #f0f0ea 100%);
      /* Le halo blanc déborde du rayon et bouche les trous aux arêtes. */
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.09), 0 0 0 2px #f4f4ef;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      padding: 14%;
      backface-visibility: hidden;
    }
    .pip {
      width: 62%; aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 32%, #4a4a58, #14141c 70%);
      align-self: center; justify-self: center;
      box-shadow: inset 0 -1px 1px rgba(255,255,255,.18);
    }
    .p-tl { grid-area: 1 / 1; } .p-tr { grid-area: 1 / 3; }
    .p-ml { grid-area: 2 / 1; } .p-mc { grid-area: 2 / 2; } .p-mr { grid-area: 2 / 3; }
    .p-bl { grid-area: 3 / 1; } .p-br { grid-area: 3 / 3; }

    /* L'ombre portée est un élément séparé : elle reste plaquée au sol pendant
       que le dé s'élève, et rétrécit avec la hauteur. C'est ce qui donne la
       sensation de vol plutôt que de glissement. */
    .shadow {
      position: absolute; top: 0; left: 0;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(0,0,0,.5), transparent 70%);
      pointer-events: none;
      will-change: transform, opacity;
    }

    /* ── Commandes ── */
    .dice-controls { display: flex; flex-direction: column; gap: 12px; }
    .dice-count {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 10px 14px;
    }
    .dice-count-label { font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); }
    .dice-stepper { display: flex; align-items: center; gap: 14px; }
    .dice-stepper button {
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--bg-raised); border: 1px solid var(--border-strong);
      color: var(--text); font-size: 1.3rem; font-family: inherit; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
      transition: background .15s, transform .1s;
    }
    .dice-stepper button:active { background: var(--orange); color: #1a1a1a; transform: scale(.92); }
    .dice-stepper button:disabled { opacity: .3; pointer-events: none; }
    .dice-stepper .val { font-size: 1.5rem; font-weight: 700; min-width: 34px; text-align: center; }
    .dice-total { text-align: center; font-size: .85rem; color: var(--text-muted); min-height: 1.35em; }
    .dice-total strong { color: var(--gold); font-size: 1.2rem; }
  </style>
</head>
<body>

  <div class="screen">
    <header class="app-header">
      <button class="header-btn" onclick="window.location.href='/'" data-i18n-aria="common.back" aria-label="Retour"><i class="fas fa-arrow-left"></i></button>
      <div class="header-brand"><i class="fas fa-guitar" style="color:var(--red);margin-right:6px;font-size:.9rem"></i>La <span class="brand-accent">Gitanerie</span></div>
      <div style="width:36px"></div>
    </header>

    <div class="page-content dice-page">

      <div id="board" class="dice-board">
        <p id="empty" class="dice-empty" data-i18n="dice.empty">Ajoute des dés avec le +</p>
      </div>

      <div class="dice-controls">
        <div class="dice-count">
          <span class="dice-count-label" data-i18n="dice.count">Nombre de dés</span>
          <div class="dice-stepper">
            <button id="minus" data-i18n-aria="dice.remove" aria-label="Retirer un dé">−</button>
            <span class="val" id="count">0</span>
            <button id="plus" data-i18n-aria="dice.add" aria-label="Ajouter un dé">+</button>
          </div>
        </div>

        <div id="total" class="dice-total"></div>

        <button id="roll" class="btn btn-primary" style="padding:18px;font-size:1.1rem" disabled>
          <i class="fas fa-dice"></i> <span data-i18n="dice.roll">Lancer</span>
        </button>
      </div>

    </div>
  </div>

  <script>
    // ══════════════════════════════════════════════════════════════════
    //  Dés 3D — moteur physique maison
    //  Les apps de référence utilisent Three.js + Cannon. Ici on obtient le
    //  même ressenti avec des cubes CSS (transform-style: preserve-3d) et une
    //  simulation écrite à la main : gravité, rebonds amortis, frottement,
    //  collisions entre dés et contre les bords. Aucune bibliothèque à
    //  télécharger — l'app reste légère et fonctionne hors-ligne.
    // ══════════════════════════════════════════════════════════════════
    (function () {
      'use strict';
      const MAX = 10;
      const T = (k, v) => (window.t ? window.t(k, v) : k);
      const vibrate = (p) => (window.gitaVibrate ? window.gitaVibrate(p) : navigator.vibrate && navigator.vibrate(p));

      const board   = document.getElementById('board');
      const emptyEl = document.getElementById('empty');
      const countEl = document.getElementById('count');
      const totalEl = document.getElementById('total');
      const btnRoll = document.getElementById('roll');
      const btnPlus = document.getElementById('plus');
      const btnMinus= document.getElementById('minus');

      // Disposition des points par face.
      const FACES = {
        1: ['p-mc'],
        2: ['p-tl', 'p-br'],
        3: ['p-tl', 'p-mc', 'p-br'],
        4: ['p-tl', 'p-tr', 'p-bl', 'p-br'],
        5: ['p-tl', 'p-tr', 'p-mc', 'p-bl', 'p-br'],
        6: ['p-tl', 'p-tr', 'p-ml', 'p-mr', 'p-bl', 'p-br'],
      };
      // Un vrai cube : 6 faces, les opposées totalisent 7 comme sur un vrai dé.
      // avant=1, arrière=6, droite=2, gauche=5, dessus=3, dessous=4.
      const FACE_TRANSFORM = {
        1: 'translateZ(var(--h, 30px))',
        6: 'rotateY(180deg) translateZ(var(--h, 30px))',
        2: 'rotateY(90deg)  translateZ(var(--h, 30px))',
        5: 'rotateY(-90deg) translateZ(var(--h, 30px))',
        3: 'rotateX(90deg)  translateZ(var(--h, 30px))',
        4: 'rotateX(-90deg) translateZ(var(--h, 30px))',
      };
      // ── Paramètres physiques ──
      const GRAVITY     = 2600;   // px/s² — chute franche, pas flottante
      const RESTITUTION = 0.42;   // énergie conservée à chaque rebond
      const FRICTION    = 0.985;  // frottement de l'air / du tapis
      const GROUND_DRAG = 0.90;   // freinage une fois posé
      const SPIN_DRAG   = 0.988;  // amortissement de la rotation
      const REST_SPEED  = 26;     // sous cette vitesse, le dé est considéré immobile

      let count = 0, dice = [], raf = 0, rolling = false, size = 60;

      try {
        const saved = parseInt(localStorage.getItem('gita_dice_count') || '0', 10);
        if (saved > 0 && saved <= MAX) count = saved;
      } catch (e) {}

      // La taille s'adapte au nombre de dés ET au tapis : 10 dés doivent tenir
      // à l'aise sans se chevaucher en permanence.
      function computeSize() {
        const w = board.clientWidth, h = board.clientHeight;
        const n = Math.max(count, 1);
        const fit = Math.sqrt((w * h) / (n * 5.2));
        size = Math.max(34, Math.min(82, Math.round(fit)));
      }

      // Ordre des emplacements de faces dans le DOM, et leur opposé.
      const SLOTS = [1, 6, 2, 5, 3, 4];   // avant, arrière, droite, gauche, dessus, dessous

      function randomLabels() {
        const front = 1 + Math.floor(Math.random() * 6);
        const back  = 7 - front;
        const rest  = [1, 2, 3, 4, 5, 6].filter(n => n !== front && n !== back);
        const top   = rest[Math.floor(Math.random() * rest.length)];
        const bottom = 7 - top;
        const pair  = rest.filter(n => n !== top && n !== bottom);
        const flip  = Math.random() < 0.5;
        // { emplacement : numéro affiché }
        return {
          1: front, 6: back,
          2: flip ? pair[0] : pair[1],
          5: flip ? pair[1] : pair[0],
          3: top, 4: bottom,
        };
      }

      function paintLabels(d) {
        d.labels = randomLabels();
        SLOTS.forEach((slot, i) => {
          const face = d.el.children[i];
          const v = d.labels[slot];
          face.innerHTML = FACES[v].map(p => `<span class="pip ${p}"></span>`).join('');
        });
      }

      function buildDie() {
        const el = document.createElement('div');
        el.className = 'die';
        el.innerHTML = SLOTS.map(slot =>
          `<div class="face" style="transform:${FACE_TRANSFORM[slot]}"></div>`
        ).join('');
        const sh = document.createElement('div');
        sh.className = 'shadow';
        board.appendChild(sh);
        board.appendChild(el);
        return { el, sh };
      }

      function applySize() {
        computeSize();
        dice.forEach(d => {
          d.el.style.width  = size + 'px';
          d.el.style.height = size + 'px';
          d.el.style.setProperty('--h', (size / 2) + 'px');
          d.sh.style.width  = size + 'px';
          d.sh.style.height = (size * 0.42) + 'px';
        });
      }

      function makeDie() {
        const { el, sh } = buildDie();
        const d = {
          el, sh,
          x: 0, y: 0, z: 0,           // z = hauteur au-dessus du tapis
          vx: 0, vy: 0, vz: 0,
          rx: 0, ry: 0,               // rotation courante (degrés)
          vrx: 0, vry: 0,
          value: 1, labels: null,
          resting: true, settling: 0,
        };
        paintLabels(d);
        d.value = d.labels[1];   // face avant tournée vers la caméra
        return d;
      }

      // Place les dés proprement répartis, à plat, sans simulation.
      function layout() {
        applySize();
        const w = board.clientWidth, h = board.clientHeight;
        const cols = Math.ceil(Math.sqrt(dice.length || 1));
        const rows = Math.ceil((dice.length || 1) / cols);
        dice.forEach((d, i) => {
          const cx = (i % cols + 0.5) / cols, cy = (Math.floor(i / cols) + 0.5) / rows;
          d.x = cx * (w - size);
          d.y = cy * (h - size);
          d.z = 0; d.vx = d.vy = d.vz = 0; d.vrx = d.vry = 0;
          d.rx = Math.round(d.rx / 90) * 90;
          d.ry = Math.round(d.ry / 90) * 90;
          d.value = d.labels[faceUp(d.rx, d.ry)];
          d.resting = true; d.settling = 0;
          draw(d);
        });
      }

      function draw(d) {
        // Le dé s'élève : on le translate en Z et on l'écarte légèrement du
        // centre de perspective pour que l'élévation se lise vraiment.
        d.el.style.transform =
          `translate3d(${d.x}px, ${d.y - Math.min(d.z, 170) * 0.42}px, ${d.z}px) ` +
          `rotateX(${d.rx}deg) rotateY(${d.ry}deg)`;
        // Ombre : plaquée au sol, plus petite et plus pâle à mesure qu'il monte.
        const k = Math.max(0, 1 - d.z / 260);
        d.sh.style.transform =
          `translate3d(${d.x + size * (1 - k) * 0.5}px, ${d.y + size * 0.72}px, 0) scale(${0.55 + k * 0.45})`;
        d.sh.style.opacity = 0.10 + k * 0.34;
      }

      function step(dt) {
        const w = board.clientWidth, h = board.clientHeight;
        let moving = false;

        for (const d of dice) {
          if (d.resting) continue;

          d.vz -= GRAVITY * dt;
          d.z  += d.vz * dt;
          d.x  += d.vx * dt;
          d.y  += d.vy * dt;
          d.rx += d.vrx * dt;
          d.ry += d.vry * dt;

          // Rebond sur le tapis
          if (d.z <= 0) {
            d.z = 0;
            if (Math.abs(d.vz) > 60) {
              d.vz = -d.vz * RESTITUTION;
              // Un impact freine la translation et la rotation : c'est ce qui
              // rend la fin de course crédible.
              d.vx *= 0.78; d.vy *= 0.78;
              d.vrx *= 0.62; d.vry *= 0.62;
            } else {
              d.vz = 0;
              d.vx *= GROUND_DRAG; d.vy *= GROUND_DRAG;
              d.vrx *= 0.86; d.vry *= 0.86;
            }
          }

          // Bords du tapis
          if (d.x < 0)          { d.x = 0;          d.vx = -d.vx * 0.55; d.vry = -d.vry * 0.7; }
          if (d.x > w - size)   { d.x = w - size;   d.vx = -d.vx * 0.55; d.vry = -d.vry * 0.7; }
          if (d.y < 0)          { d.y = 0;          d.vy = -d.vy * 0.55; d.vrx = -d.vrx * 0.7; }
          if (d.y > h - size)   { d.y = h - size;   d.vy = -d.vy * 0.55; d.vrx = -d.vrx * 0.7; }

          d.vx *= FRICTION; d.vy *= FRICTION;
          d.vrx *= SPIN_DRAG; d.vry *= SPIN_DRAG;

          const speed = Math.hypot(d.vx, d.vy) + Math.abs(d.vz);
          if (d.z === 0 && speed < REST_SPEED) {
            // Calage sur l'angle droit le plus proche : le dé se pose comme un
            // vrai dé qui bascule sur sa dernière arête, au lieu de pivoter
            // vers une face imposée.
            if (d.settling === 0) {
              d.tx = Math.round(d.rx / 90) * 90;
              d.ty = Math.round(d.ry / 90) * 90;
            }
            d.settling += dt;
            d.rx += shortest(d.rx, d.tx) * Math.min(1, dt * 9);
            d.ry += shortest(d.ry, d.ty) * Math.min(1, dt * 9);
            d.vx *= 0.7; d.vy *= 0.7;
            if (d.settling > 0.34) {
              d.rx = d.tx; d.ry = d.ty;
              d.vx = d.vy = d.vrx = d.vry = 0;
              d.value = d.labels[faceUp(d.rx, d.ry)];   // la valeur DÉCOULE de la pose
              d.resting = true;
            }
          }
          if (!d.resting) moving = true;
          draw(d);
        }

        separate();
        clampAll();
        return moving;
      }

      // Écart minimal entre deux dés : sans ça ils se traversent et se
      // superposent, ce qui casse immédiatement l'illusion.
      function separate() {
        for (let i = 0; i < dice.length; i++) {
          for (let j = i + 1; j < dice.length; j++) {
            const a = dice[i], b = dice[j];
            if (Math.abs(a.z - b.z) > size * 0.8) continue;
            let dx = b.x - a.x, dy = b.y - a.y;
            const dist = Math.hypot(dx, dy) || 0.001;
            const min = size * 0.94;
            if (dist < min) {
              const push = (min - dist) / 2;
              dx /= dist; dy /= dist;
              a.x -= dx * push; a.y -= dy * push;
              b.x += dx * push; b.y += dy * push;
              if (!a.resting || !b.resting) {
                const ex = dx * 26, ey = dy * 26;
                a.vx -= ex; a.vy -= ey; b.vx += ex; b.vy += ey;
                a.resting = b.resting = false;
                a.settling = b.settling = 0;
              }
            }
          }
        }
      }

      // Quelle face regarde la caméra ? On fait tourner la normale de chaque
      // face par l'orientation courante et on garde celle dont la composante Z
      // est la plus grande. Calculé, jamais deviné : impossible d'afficher une
      // valeur qui ne corresponde pas à la face visible.
      const NORMALS = {
        1: [0, 0, 1], 6: [0, 0, -1],
        2: [1, 0, 0], 5: [-1, 0, 0],
        3: [0, -1, 0], 4: [0, 1, 0],
      };
      function faceUp(rx, ry) {
        const ax = rx * Math.PI / 180, ay = ry * Math.PI / 180;
        const cx = Math.cos(ax), sx = Math.sin(ax);
        const cy = Math.cos(ay), sy = Math.sin(ay);
        let best = 1, bestZ = -2;
        for (const v in NORMALS) {
          const [x, y, z] = NORMALS[v];
          // rotateY puis rotateX, dans l'ordre où le CSS les applique.
          const x1 = x * cy + z * sy, y1 = y, z1 = -x * sy + z * cy;
          const z2 = y1 * sx + z1 * cx;
          if (z2 > bestZ) { bestZ = z2; best = +v; }
        }
        return best;
      }

      // Recadrage final : garantit qu'aucun dé ne se retrouve hors du tapis
      // après avoir été repoussé par un voisin.
      function clampAll() {
        const w = board.clientWidth, h = board.clientHeight;
        for (const d of dice) {
          if (d.x < 0) d.x = 0;
          else if (d.x > w - size) d.x = w - size;
          if (d.y < 0) d.y = 0;
          else if (d.y > h - size) d.y = h - size;
        }
      }

      // Plus court chemin angulaire vers la cible (évite un tour complet).
      function shortest(from, to) {
        let d = (to - from) % 360;
        if (d > 180) d -= 360;
        if (d < -180) d += 360;
        return d;
      }

      let last = 0;
      function loop(ts) {
        if (!last) last = ts;
        // Plafonné : après un passage en arrière-plan, un dt énorme ferait
        // traverser les murs aux dés.
        const dt = Math.min(0.032, (ts - last) / 1000);
        last = ts;
        const moving = step(dt);
        if (moving) {
          raf = requestAnimationFrame(loop);
        } else {
          raf = 0; last = 0; rolling = false;
          btnRoll.disabled = count === 0;
          renderTotal();
          vibrate(14);
        }
      }

      function roll() {
        if (rolling || count === 0) return;
        rolling = true;
        btnRoll.disabled = true;
        totalEl.textContent = '';
        applySize();

        dice.forEach((d) => {
          paintLabels(d);   // nouvel étiquetage → tirage équitable
          // On repart de la position ACTUELLE du dé : il est soulevé et relancé
          // sur place, au lieu d'être téléporté en bas du tapis.
          d.z = 30 + Math.random() * 60;
          const ang = Math.random() * Math.PI * 2;
          const force = 220 + Math.random() * 320;
          d.vx = Math.cos(ang) * force;
          d.vy = Math.sin(ang) * force;
          d.vz = 430 + Math.random() * 330;
          d.vrx = (Math.random() - 0.5) * 1700;
          d.vry = (Math.random() - 0.5) * 1700;
          d.resting = false; d.settling = 0;
          draw(d);
        });

        vibrate([16, 34, 12]);
        if (!raf) { last = 0; raf = requestAnimationFrame(loop); }
      }

      function renderTotal() {
        if (!dice.length) { totalEl.textContent = ''; return; }
        const sum = dice.reduce((a, d) => a + d.value, 0);
        totalEl.innerHTML = `${T('dice.total')} <strong>${sum}</strong>`;
      }

      function sync() {
        countEl.textContent = count;
        btnPlus.disabled  = count >= MAX;
        btnMinus.disabled = count <= 0;
        btnRoll.disabled  = count === 0 || rolling;
        emptyEl.style.display = count === 0 ? '' : 'none';
      }

      function setCount(n) {
        const next = Math.max(0, Math.min(MAX, n));
        if (next === count) return;
        count = next;
        try { localStorage.setItem('gita_dice_count', String(count)); } catch (e) {}
        while (dice.length < count) dice.push(makeDie());
        while (dice.length > count) {
          const d = dice.pop();
          d.el.remove(); d.sh.remove();
        }
        sync();
        layout();
        renderTotal();
        vibrate(8);
      }

      btnPlus.onclick  = () => setCount(count + 1);
      btnMinus.onclick = () => setCount(count - 1);
      btnRoll.onclick  = roll;
      board.addEventListener('click', () => { if (count > 0) roll(); });

      // Une rotation change les dimensions du tapis : on replace tout.
      window.addEventListener('resize', () => { if (!rolling) layout(); });
      window.addEventListener('gita:langchange', () => { sync(); renderTotal(); });

      // Mise en place initiale (après le premier rendu, pour connaître la
      // taille réelle du tapis).
      requestAnimationFrame(() => {
        for (let i = 0; i < count; i++) dice.push(makeDie());
        sync(); layout(); renderTotal();
      });
    })();
  </script>

  <!-- Retour haptique partagé (window.gitaVibrate). Script classique, comme
       sur les autres pages : gestures.js n'est pas un module. -->
  <script src="/js/gestures.js"></script>
</body></html>

<!DOCTYPE html>
<html lang="fr"><head>
  <meta charset="UTF-8">
  <style id="gita-early-bg">html{background:#243242}</style>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#243242">
  <title>Dés — La Gitanerie</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&amp;family=Playfair+Display:wght@700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/main.css">
  <script src="/js/i18n.js"></script>
  <style>
    .dice-page { flex: 1; display: flex; flex-direction: column; gap: 16px; }

    /* ── Le tapis ──
       Perspective réelle : les dés sont de vrais cubes qui tournent sur trois
       axes, pas des carrés qu'on fait pivoter à plat. */
    .dice-board {
      flex: 1;
      position: relative;
      min-height: 44vh;
      border-radius: var(--radius);
      background:
        radial-gradient(120% 80% at 50% 0%, rgba(255,255,255,.035), transparent 70%),
        var(--bg-card);
      border: 1px solid var(--border);
      overflow: hidden;
      perspective: 900px;
      perspective-origin: 50% 42%;
      touch-action: manipulation;
    }
    .dice-empty {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted); font-size: .9rem; text-align: center; padding: 20px;
      pointer-events: none;
    }

    /* Chaque dé est positionné par le moteur : on ne met AUCUNE transition CSS,
       sinon elle entrerait en conflit avec les transformations calculées à
       chaque image. */
    .die {
      position: absolute;
      top: 0; left: 0;
      transform-style: preserve-3d;
      will-change: transform;
    }
    .face {
      position: absolute; inset: 0;
      /* Arrondi discret : au-delà, les coins laissent des trous aux arêtes du
         cube. Aucune ombre portée vers l'extérieur — elle déborderait de la
         silhouette et se verrait comme un liseré blanc sur le côté. */
      border-radius: 5%;
      background: linear-gradient(158deg, #fff 0%, #f0f0ea 100%);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.09);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      padding: 14%;
      backface-visibility: hidden;
    }
    .pip {
      width: 62%; aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 32%, #4a4a58, #14141c 70%);
      align-self: center; justify-self: center;
      box-shadow: inset 0 -1px 1px rgba(255,255,255,.18);
    }
    .p-tl { grid-area: 1 / 1; } .p-tr { grid-area: 1 / 3; }
    .p-ml { grid-area: 2 / 1; } .p-mc { grid-area: 2 / 2; } .p-mr { grid-area: 2 / 3; }
    .p-bl { grid-area: 3 / 1; } .p-br { grid-area: 3 / 3; }

    /* L'ombre portée est un élément séparé : elle reste plaquée au sol pendant
       que le dé s'élève, et rétrécit avec la hauteur. C'est ce qui donne la
       sensation de vol plutôt que de glissement. */
    .shadow {
      position: absolute; top: 0; left: 0;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(0,0,0,.5), transparent 70%);
      pointer-events: none;
      will-change: transform, opacity;
    }

    /* ── Commandes ── */
    .dice-controls { display: flex; flex-direction: column; gap: 12px; }
    .dice-count {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 10px 14px;
    }
    .dice-count-label { font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); }
    .dice-stepper { display: flex; align-items: center; gap: 14px; }
    .dice-stepper button {
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--bg-raised); border: 1px solid var(--border-strong);
      color: var(--text); font-size: 1.3rem; font-family: inherit; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
      transition: background .15s, transform .1s;
    }
    .dice-stepper button:active { background: var(--orange); color: #1a1a1a; transform: scale(.92); }
    .dice-stepper button:disabled { opacity: .3; pointer-events: none; }
    .dice-stepper .val { font-size: 1.5rem; font-weight: 700; min-width: 34px; text-align: center; }
    .dice-total { text-align: center; font-size: .85rem; color: var(--text-muted); min-height: 1.35em; }
    .dice-total strong { color: var(--gold); font-size: 1.2rem; }
  </style>
</head>
<body>

  <div class="screen">
    <header class="app-header">
      <button class="header-btn" onclick="window.location.href='/'" data-i18n-aria="common.back" aria-label="Retour"><i class="fas fa-arrow-left"></i></button>
      <div class="header-brand"><i class="fas fa-guitar" style="color:var(--red);margin-right:6px;font-size:.9rem"></i>La <span class="brand-accent">Gitanerie</span></div>
      <div style="width:36px"></div>
    </header>

    <div class="page-content dice-page">

      <div id="board" class="dice-board">
        <p id="empty" class="dice-empty" data-i18n="dice.empty">Ajoute des dés avec le +</p>
      </div>

      <div class="dice-controls">
        <div class="dice-count">
          <span class="dice-count-label" data-i18n="dice.count">Nombre de dés</span>
          <div class="dice-stepper">
            <button id="minus" data-i18n-aria="dice.remove" aria-label="Retirer un dé">−</button>
            <span class="val" id="count">0</span>
            <button id="plus" data-i18n-aria="dice.add" aria-label="Ajouter un dé">+</button>
          </div>
        </div>

        <div id="total" class="dice-total"></div>

        <button id="roll" class="btn btn-primary" style="padding:18px;font-size:1.1rem" disabled>
          <i class="fas fa-dice"></i> <span data-i18n="dice.roll">Lancer</span>
        </button>
      </div>

    </div>
  </div>

  <script>
    // ══════════════════════════════════════════════════════════════════
    //  Dés — simulation de corps rigides
    //
    //  Modèle identique à celui des moteurs physiques (Cannon, Bullet, Jolt),
    //  réduit à ce dont un dé a besoin :
    //    · orientation en QUATERNION, pas en angles d'Euler — pas de blocage
    //      de cardan, et une rotation libre sur les trois axes ;
    //    · vitesse angulaire vectorielle et inertie de cube (exacte : un cube
    //      a ses trois moments principaux égaux, un scalaire suffit) ;
    //    · contacts par les HUIT COINS du cube, avec impulsion et couple. C'est
    //      ce point qui change tout : un dé qui touche par un coin bascule sur
    //      sa face, au lieu de glisser à plat.
    //
    //  Repère : x vers la droite, y vers le bas de l'écran, z vers la caméra.
    //  Le tapis est le plan z = 0 ; la gravité tire vers -z.
    // ══════════════════════════════════════════════════════════════════
    (function () {
      'use strict';
      const MAX = 10;
      const T = (k, v) => (window.t ? window.t(k, v) : k);
      const vibrate = (p) => (window.gitaVibrate ? window.gitaVibrate(p) : navigator.vibrate && navigator.vibrate(p));

      const board   = document.getElementById('board');
      const emptyEl = document.getElementById('empty');
      const countEl = document.getElementById('count');
      const totalEl = document.getElementById('total');
      const btnRoll = document.getElementById('roll');
      const btnPlus = document.getElementById('plus');
      const btnMinus= document.getElementById('minus');

      // ── Géométrie du dé ──
      const FACES = {
        1: ['p-mc'],
        2: ['p-tl', 'p-br'],
        3: ['p-tl', 'p-mc', 'p-br'],
        4: ['p-tl', 'p-tr', 'p-bl', 'p-br'],
        5: ['p-tl', 'p-tr', 'p-mc', 'p-bl', 'p-br'],
        6: ['p-tl', 'p-tr', 'p-ml', 'p-mr', 'p-bl', 'p-br'],
      };
      const SLOTS = [1, 6, 2, 5, 3, 4];   // avant, arrière, droite, gauche, dessus, dessous
      const FACE_TRANSFORM = {
        1: 'translateZ(var(--h, 30px))',
        6: 'rotateY(180deg) translateZ(var(--h, 30px))',
        2: 'rotateY(90deg)  translateZ(var(--h, 30px))',
        5: 'rotateY(-90deg) translateZ(var(--h, 30px))',
        3: 'rotateX(90deg)  translateZ(var(--h, 30px))',
        4: 'rotateX(-90deg) translateZ(var(--h, 30px))',
      };
      // Normale de chaque emplacement dans le repère du dé.
      const SLOT_N = {
        1: [0, 0, 1], 6: [0, 0, -1],
        2: [1, 0, 0], 5: [-1, 0, 0],
        3: [0, -1, 0], 4: [0, 1, 0],
      };

      // ── Paramètres physiques ──
      const GRAVITY     = 2400;   // px/s²
      const RESTITUTION = 0.28;   // un dé rebondit peu : il est lourd et mat
      const FRICTION    = 0.42;   // frottement sur le tapis (coefficient de Coulomb)
      const AIR         = 0.9965; // traînée
      const SPIN_AIR    = 0.996;
      const SLOP        = 0.8;    // tolérance de contact (voir groundContact)
      const ROLL_DRAG   = 6.0;    // résistance au roulement, une fois au sol
      const MAX_ROLL    = 3.2;    // durée maximale d'un lancer (garde-fou)
      const SLEEP_V     = 14;     // seuils d'endormissement
      const SLEEP_W     = 0.9;
      const SLEEP_TIME  = 0.16;

      // ══════ Quaternions ══════
      function qmul(a, b) {
        return [
          a[0]*b[0] - a[1]*b[1] - a[2]*b[2] - a[3]*b[3],
          a[0]*b[1] + a[1]*b[0] + a[2]*b[3] - a[3]*b[2],
          a[0]*b[2] - a[1]*b[3] + a[2]*b[0] + a[3]*b[1],
          a[0]*b[3] + a[1]*b[2] - a[2]*b[1] + a[3]*b[0],
        ];
      }
      function qnorm(q) {
        const n = Math.hypot(q[0], q[1], q[2], q[3]) || 1;
        return [q[0]/n, q[1]/n, q[2]/n, q[3]/n];
      }
      // Intégration de l'orientation par la vitesse angulaire :
      // dq/dt = ½ · ω ⊗ q   (ω vu comme quaternion pur)
      function qIntegrate(q, w, dt) {
        const wq = [0, w[0], w[1], w[2]];
        const d  = qmul(wq, q);
        return qnorm([
          q[0] + 0.5 * d[0] * dt, q[1] + 0.5 * d[1] * dt,
          q[2] + 0.5 * d[2] * dt, q[3] + 0.5 * d[3] * dt,
        ]);
      }
      function qMatrix(q) {
        const [w, x, y, z] = q;
        const xx = x*x, yy = y*y, zz = z*z;
        const xy = x*y, xz = x*z, yz = y*z;
        const wx = w*x, wy = w*y, wz = w*z;
        return [
          1 - 2*(yy+zz), 2*(xy - wz),   2*(xz + wy),
          2*(xy + wz),   1 - 2*(xx+zz), 2*(yz - wx),
          2*(xz - wy),   2*(yz + wx),   1 - 2*(xx+yy),
        ];
      }
      function rot(m, v) {
        return [
          m[0]*v[0] + m[1]*v[1] + m[2]*v[2],
          m[3]*v[0] + m[4]*v[1] + m[5]*v[2],
          m[6]*v[0] + m[7]*v[1] + m[8]*v[2],
        ];
      }
      const cross = (a, b) => [
        a[1]*b[2] - a[2]*b[1],
        a[2]*b[0] - a[0]*b[2],
        a[0]*b[1] - a[1]*b[0],
      ];
      const dot = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];

      // Emplacement tourné vers la caméra (+z) pour une orientation donnée.
      function faceUp(q) {
        const m = qMatrix(q);
        let best = 1, bz = -2;
        for (const slot in SLOT_N) {
          const z = rot(m, SLOT_N[slot])[2];
          if (z > bz) { bz = z; best = +slot; }
        }
        return best;
      }

      // ══════ Étiquetage aléatoire ══════
      // La physique ne présente pas les six faces de façon parfaitement
      // équiprobable. Plutôt que de forcer le résultat — ce qui produirait à
      // nouveau une correction visible — on renumérote le dé avant chaque
      // lancer. Le numéro porté par la face qui sort est alors uniforme.
      function randomLabels() {
        const front = 1 + Math.floor(Math.random() * 6), back = 7 - front;
        const rest  = [1,2,3,4,5,6].filter(n => n !== front && n !== back);
        const top   = rest[Math.floor(Math.random() * rest.length)], bottom = 7 - top;
        const pair  = rest.filter(n => n !== top && n !== bottom);
        const flip  = Math.random() < 0.5;
        return {
          1: front, 6: back,
          2: flip ? pair[0] : pair[1], 5: flip ? pair[1] : pair[0],
          3: top, 4: bottom,
        };
      }

      let count = 0, dice = [], raf = 0, rolling = false, size = 60, half = 30, inertia = 1;

      try {
        const saved = parseInt(localStorage.getItem('gita_dice_count') || '0', 10);
        if (saved > 0 && saved <= MAX) count = saved;
      } catch (e) {}

      function computeSize() {
        const w = board.clientWidth, h = board.clientHeight;
        const n = Math.max(count, 1);
        size = Math.max(34, Math.min(80, Math.round(Math.sqrt((w * h) / (n * 5.6)))));
        half = size / 2;
        // Cube homogène : I = m·(2a)²/6 avec a = demi-arête. Masse = 1.
        inertia = (2 / 3) * half * half;
      }

      function paintLabels(d) {
        d.labels = randomLabels();
        SLOTS.forEach((slot, i) => {
          d.el.children[i].innerHTML =
            FACES[d.labels[slot]].map(p => `<span class="pip ${p}"></span>`).join('');
        });
      }

      function makeDie() {
        const el = document.createElement('div');
        el.className = 'die';
        el.innerHTML = SLOTS.map(slot =>
          `<div class="face" style="transform:${FACE_TRANSFORM[slot]}"></div>`).join('');
        const sh = document.createElement('div');
        sh.className = 'shadow';
        board.appendChild(sh); board.appendChild(el);
        const d = {
          el, sh,
          p: [0, 0, 0],          // centre
          v: [0, 0, 0],          // vitesse
          q: [1, 0, 0, 0],       // orientation
          w: [0, 0, 0],          // vitesse angulaire (rad/s)
          value: 1, labels: null,
          resting: true, calm: 0, awake: 0,
        };
        paintLabels(d);
        d.value = d.labels[faceUp(d.q)];
        return d;
      }

      function applySize() {
        computeSize();
        for (const d of dice) {
          d.el.style.width = size + 'px';
          d.el.style.height = size + 'px';
          d.el.style.setProperty('--h', half + 'px');
          d.sh.style.width = size + 'px';
          d.sh.style.height = (size * 0.4) + 'px';
        }
      }

      // Les huit coins, dans le repère du dé.
      const CORNERS = [];
      for (const sx of [-1, 1]) for (const sy of [-1, 1]) for (const sz of [-1, 1]) CORNERS.push([sx, sy, sz]);

      function draw(d) {
        const m = qMatrix(d.q);
        // Colonnes de la matrice pour matrix3d (ordre colonne par colonne).
        const mat = `matrix3d(${m[0]},${m[3]},${m[6]},0,${m[1]},${m[4]},${m[7]},0,${m[2]},${m[5]},${m[8]},0,0,0,0,1)`;
        const x = d.p[0] - half, y = d.p[1] - half, z = d.p[2];
        // L'altitude se lit aussi par un léger décalage vers le haut : sans lui,
        // la seule perspective ne suffit pas à distinguer « en l'air » de « posé ».
        d.el.style.transform = `translate3d(${x}px, ${y - Math.min(z, 200) * 0.34}px, ${z}px) ${mat}`;
        const k = Math.max(0, 1 - z / 300);
        d.sh.style.transform = `translate3d(${x}px, ${y + size * 0.66}px, 0) scale(${0.5 + k * 0.5})`;
        d.sh.style.opacity = 0.08 + k * 0.32;
      }

      // ══════ Contact d'un coin avec le tapis ══════
      // Résolution par impulsion : composante normale (rebond) puis tangentielle
      // (frottement). Le couple r × j est ce qui fait basculer le dé.
      function groundContact(d, dt) {
        const m = qMatrix(d.q);
        let deepest = 0, touching = false;
        for (const c of CORNERS) {
          const r  = rot(m, [c[0]*half, c[1]*half, c[2]*half]);
          const pz = d.p[2] + r[2];
          // Tolérance : un dé posé à plat a ses coins EXACTEMENT à z=0. Sans
          // cette marge, il n'a aucun contact, donc aucun frottement — et sa
          // rotation résiduelle ne s'amortit jamais. C'est ce qui faisait
          // tourner certains dés sans fin.
          if (pz >= SLOP) continue;
          touching = true;
          if (-pz > deepest) deepest = -pz;

          // Vitesse du point de contact : v + ω × r
          const wxr = cross(d.w, r);
          const vp  = [d.v[0] + wxr[0], d.v[1] + wxr[1], d.v[2] + wxr[2]];
          const vn  = vp[2];                    // normale = (0,0,1)
          if (vn >= 0) continue;

          // Dénominateur d'impulsion : 1/m + ((r×n)·(r×n))/I
          const rn  = cross(r, [0, 0, 1]);
          const den = 1 + dot(rn, rn) / inertia;
          const j   = -(1 + RESTITUTION) * vn / den;

          d.v[2] += j;
          const tq = cross(r, [0, 0, j]);
          d.w[0] += tq[0] / inertia; d.w[1] += tq[1] / inertia; d.w[2] += tq[2] / inertia;

          // Frottement : impulsion tangentielle bornée par µ·j (loi de Coulomb)
          const vt = [vp[0], vp[1], 0];
          const vtl = Math.hypot(vt[0], vt[1]);
          if (vtl > 0.001) {
            const t = [vt[0]/vtl, vt[1]/vtl, 0];
            const rt = cross(r, t);
            const dent = 1 + dot(rt, rt) / inertia;
            let jt = -vtl / dent;
            const maxJt = FRICTION * Math.abs(j);
            if (jt < -maxJt) jt = -maxJt;
            d.v[0] += jt * t[0]; d.v[1] += jt * t[1];
            const tq2 = cross(r, [jt*t[0], jt*t[1], 0]);
            d.w[0] += tq2[0] / inertia; d.w[1] += tq2[1] / inertia; d.w[2] += tq2[2] / inertia;
          }
        }
        // Correction de position : on remonte le dé hors du sol.
        if (deepest > 0) d.p[2] += deepest;
        // Résistance au roulement : un vrai dé posé s'immobilise vite, il ne
        // continue pas à tourner sur lui-même.
        if (touching) {
          const k = Math.max(0, 1 - ROLL_DRAG * dt);
          d.w[0] *= k; d.w[1] *= k; d.w[2] *= k;
        }
      }

      // ══════ Choc entre deux dés ══════
      // Sphères englobantes : à cette taille et cette vitesse, la différence
      // avec un contact cube-cube est invisible, pour un coût bien moindre.
      function diceContacts() {
        const R = half * 1.06;
        for (let pass = 0; pass < 2; pass++) {
          for (let i = 0; i < dice.length; i++) {
            for (let j = i + 1; j < dice.length; j++) {
              const a = dice[i], b = dice[j];
              let n = [b.p[0]-a.p[0], b.p[1]-a.p[1], b.p[2]-a.p[2]];
              let dist = Math.hypot(n[0], n[1], n[2]);
              if (dist >= 2*R) continue;
              if (dist < 0.0001) {
                const ang = Math.random() * Math.PI * 2;
                n = [Math.cos(ang), Math.sin(ang), 0]; dist = 0.0001;
              } else { n = [n[0]/dist, n[1]/dist, n[2]/dist]; }

              // Séparation
              const pen = (2*R - dist) / 2;
              a.p[0] -= n[0]*pen; a.p[1] -= n[1]*pen; a.p[2] -= n[2]*pen;
              b.p[0] += n[0]*pen; b.p[1] += n[1]*pen; b.p[2] += n[2]*pen;
              if (a.p[2] < half*0.2) a.p[2] = half*0.2;
              if (b.p[2] < half*0.2) b.p[2] = half*0.2;

              // Impulsion au point de contact, avec couple : c'est ce qui
              // relance les dés en rotation après un choc.
              const ra = [ n[0]*R,  n[1]*R,  n[2]*R];
              const rb = [-n[0]*R, -n[1]*R, -n[2]*R];
              const va = cross(a.w, ra), vb = cross(b.w, rb);
              const rel = [
                (b.v[0]+vb[0]) - (a.v[0]+va[0]),
                (b.v[1]+vb[1]) - (a.v[1]+va[1]),
                (b.v[2]+vb[2]) - (a.v[2]+va[2]),
              ];
              const vn = dot(rel, n);
              if (vn >= 0) continue;
              const rna = cross(ra, n), rnb = cross(rb, n);
              const den = 2 + (dot(rna, rna) + dot(rnb, rnb)) / inertia;
              const jm  = -(1 + 0.35) * vn / den;

              a.v[0] -= jm*n[0]; a.v[1] -= jm*n[1]; a.v[2] -= jm*n[2];
              b.v[0] += jm*n[0]; b.v[1] += jm*n[1]; b.v[2] += jm*n[2];
              const ta = cross(ra, [-jm*n[0], -jm*n[1], -jm*n[2]]);
              const tb = cross(rb, [ jm*n[0],  jm*n[1],  jm*n[2]]);
              a.w[0] += ta[0]/inertia; a.w[1] += ta[1]/inertia; a.w[2] += ta[2]/inertia;
              b.w[0] += tb[0]/inertia; b.w[1] += tb[1]/inertia; b.w[2] += tb[2]/inertia;

              if (Math.abs(vn) > 12) { a.resting = false; b.resting = false; a.calm = b.calm = 0; }
            }
          }
        }
      }

      function walls(d) {
        const w = board.clientWidth, h = board.clientHeight;
        // Encombrement réel du cube une fois tourné : demi-somme des valeurs
        // absolues de la ligne correspondante de la matrice de rotation. Exact,
        // et bien plus serré que le rayon circonscrit.
        const m = qMatrix(d.q);
        const ex = (Math.abs(m[0]) + Math.abs(m[1]) + Math.abs(m[2])) * half;
        const ey = (Math.abs(m[3]) + Math.abs(m[4]) + Math.abs(m[5])) * half;
        if (d.p[0] < ex)     { d.p[0] = ex;     d.v[0] = Math.abs(d.v[0]) * 0.5; d.w[1] *= -0.6; }
        if (d.p[0] > w - ex) { d.p[0] = w - ex; d.v[0] = -Math.abs(d.v[0]) * 0.5; d.w[1] *= -0.6; }
        if (d.p[1] < ey)     { d.p[1] = ey;     d.v[1] = Math.abs(d.v[1]) * 0.5; d.w[0] *= -0.6; }
        if (d.p[1] > h - ey) { d.p[1] = h - ey; d.v[1] = -Math.abs(d.v[1]) * 0.5; d.w[0] *= -0.6; }
      }

      function step(dt) {
        for (const d of dice) {
          if (d.resting) continue;
          d.v[2] -= GRAVITY * dt;
          d.p[0] += d.v[0]*dt; d.p[1] += d.v[1]*dt; d.p[2] += d.v[2]*dt;
          d.q = qIntegrate(d.q, d.w, dt);
          groundContact(d, dt);
          walls(d);
          d.v[0] *= AIR; d.v[1] *= AIR; d.v[2] *= AIR;
          d.w[0] *= SPIN_AIR; d.w[1] *= SPIN_AIR; d.w[2] *= SPIN_AIR;
        }

        diceContacts();
        // Les chocs se résolvent APRÈS les murs : un dé repoussé par un voisin
        // pouvait donc finir hors du plateau. On revalide les bords ensuite.
        for (const d of dice) walls(d);

        let moving = false;
        for (const d of dice) {
          if (!d.resting) {
            d.awake += dt;
            const sv = Math.hypot(d.v[0], d.v[1], d.v[2]);
            const sw = Math.hypot(d.w[0], d.w[1], d.w[2]);
            // Garde-fou : un dé coincé contre un autre peut glisser très
            // longtemps sous les seuils d'arrêt. Passé ce délai on l'immobilise
            // — mieux vaut une fin nette qu'une animation qui n'en finit pas.
            if (d.awake > MAX_ROLL) {
              d.v = [0, 0, 0]; d.w = [0, 0, 0];
              d.value = d.labels[faceUp(d.q)];
              d.resting = true;
            } else if (sv < SLEEP_V && sw < SLEEP_W) {
              d.calm += dt;
              // Aucun redressement : le dé garde exactement la pose que la
              // physique lui a donnée. Il peut rester légèrement de travers,
              // comme un vrai dé sur une table — c'est même plus crédible.
              d.v[0] *= 0.82; d.v[1] *= 0.82;
              d.w[0] *= 0.82; d.w[1] *= 0.82; d.w[2] *= 0.82;
              if (d.calm > SLEEP_TIME) {
                d.v = [0, 0, 0]; d.w = [0, 0, 0];
                // La valeur reste celle de la face la plus tournée vers nous :
                // le calcul ne suppose aucun alignement.
                d.value = d.labels[faceUp(d.q)];
                d.resting = true;
              }
            } else { d.calm = 0; }
          }
          if (!d.resting) moving = true;
          draw(d);
        }
        return moving;
      }

      let last = 0;
      function loop(ts) {
        if (!last) last = ts;
        let dt = (ts - last) / 1000;
        last = ts;
        if (dt > 0.05) dt = 0.05;          // retour d'arrière-plan
        // Sous-pas : à grande vitesse angulaire, un seul pas par image fait
        // traverser le sol aux coins et l'atterrissage devient mou.
        const n = 3, sub = dt / n;
        let moving = false;
        for (let i = 0; i < n; i++) moving = step(sub) || moving;
        if (moving) {
          raf = requestAnimationFrame(loop);
        } else {
          raf = 0; last = 0; rolling = false;
          btnRoll.disabled = count === 0;
          renderTotal();
          vibrate(14);
        }
      }

      function roll() {
        if (rolling || count === 0) return;
        rolling = true;
        btnRoll.disabled = true;
        totalEl.textContent = '';
        applySize();
        for (const d of dice) {
          paintLabels(d);
          // Soulevé et relancé depuis sa position actuelle.
          d.p[2] = half + 40 + Math.random() * 70;
          const ang = Math.random() * Math.PI * 2;
          const force = 190 + Math.random() * 300;
          d.v = [Math.cos(ang)*force, Math.sin(ang)*force, 330 + Math.random()*260];
          // Rotation initiale : axe quelconque, vitesse élevée.
          const ax = [Math.random()-0.5, Math.random()-0.5, Math.random()-0.5];
          const al = Math.hypot(ax[0], ax[1], ax[2]) || 1;
          const spin = 16 + Math.random() * 18;    // rad/s
          d.w = [ax[0]/al*spin, ax[1]/al*spin, ax[2]/al*spin];
          d.resting = false; d.calm = 0; d.awake = 0;
        }
        vibrate([16, 34, 12]);
        if (!raf) { last = 0; raf = requestAnimationFrame(loop); }
      }

      function renderTotal() {
        if (!dice.length) { totalEl.textContent = ''; return; }
        const sum = dice.reduce((a, d) => a + d.value, 0);
        totalEl.innerHTML = `${T('dice.total')} <strong>${sum}</strong>`;
      }

      function sync() {
        countEl.textContent = count;
        btnPlus.disabled  = count >= MAX;
        btnMinus.disabled = count <= 0;
        btnRoll.disabled  = count === 0 || rolling;
        emptyEl.style.display = count === 0 ? '' : 'none';
      }

      function layout() {
        applySize();
        const w = board.clientWidth, h = board.clientHeight;
        const cols = Math.ceil(Math.sqrt(dice.length || 1));
        const rows = Math.ceil((dice.length || 1) / cols);
        dice.forEach((d, i) => {
          d.p = [
            ((i % cols) + 0.5) / cols * w,
            (Math.floor(i / cols) + 0.5) / rows * h,
            half,
          ];
          d.v = [0, 0, 0]; d.w = [0, 0, 0];
          d.value = d.labels[faceUp(d.q)];
          d.resting = true; d.calm = 0;
          walls(d);
          draw(d);
        });
      }

      function setCount(n) {
        const next = Math.max(0, Math.min(MAX, n));
        if (next === count) return;
        count = next;
        try { localStorage.setItem('gita_dice_count', String(count)); } catch (e) {}
        while (dice.length < count) dice.push(makeDie());
        while (dice.length > count) { const d = dice.pop(); d.el.remove(); d.sh.remove(); }
        sync(); layout(); renderTotal(); vibrate(8);
      }

      btnPlus.onclick  = () => setCount(count + 1);
      btnMinus.onclick = () => setCount(count - 1);
      btnRoll.onclick  = roll;
      board.addEventListener('click', () => { if (count > 0) roll(); });

      window.addEventListener('resize', () => { if (!rolling) layout(); });
      window.addEventListener('gita:langchange', () => { sync(); renderTotal(); });

      requestAnimationFrame(() => {
        for (let i = 0; i < count; i++) dice.push(makeDie());
        sync(); layout(); renderTotal();
      });
    })();
  </script>

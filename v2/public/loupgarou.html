<!DOCTYPE html>
<html lang="fr"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#2c3e50">
  <title>Loup-Garou — La Gitanerie</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="preconnect" href="https://www.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&amp;family=Playfair+Display:wght@700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .avatar-circle {
      width: 80px; height: 80px; border-radius: 50%;
      background: var(--bg-surface); border: 3px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 2.4rem; cursor: pointer; overflow: hidden;
      transition: border-color var(--transition); flex-shrink: 0;
    }
    .avatar-circle:active { border-color: var(--red); }
    .avatar-circle img { width: 100%; height: 100%; object-fit: cover; }

    .section-tabs { display: flex; background: var(--bg-surface); border-radius: var(--radius-sm); padding: 4px; gap: 4px; }
    .tab-btn {
      flex: 1; padding: 10px; border: none; border-radius: 8px; background: transparent;
      color: var(--text-muted); font-family: inherit; font-size: 0.9rem; font-weight: 600;
      cursor: pointer; transition: all var(--transition);
    }
    .tab-btn.active { background: var(--orange); color: #1a1a1a; }
  </style>
</head>
<body>

  <div class="screen">
    <header class="app-header">
      <button class="header-btn" onclick="window.location.href='/'"><i class="fas fa-arrow-left"></i></button>
      <div class="header-brand">🐺 Loup-<span class="brand-accent">Garou</span></div>
      <div style="width:36px"></div>
    </header>

    <div class="page-content">

      <!-- Profil -->
      <div class="card flex-col gap-16">
        <h3>Ton profil</h3>
        <div class="flex items-center gap-16">
          <div class="avatar-circle" id="avatar-display" onclick="document.getElementById('photo-input').click()">📸</div>
          <div class="flex-col gap-8" style="flex:1">
            <span class="text-sm text-muted">Appuie sur le cercle pour ajouter une photo</span>
            <input type="file" id="photo-input" accept="image/*" style="display:none">
          </div>
        </div>
        <div class="input-group">
          <label>Nom de joueur</label>
          <input type="text" id="input-name" class="input" placeholder="Ton pseudo" maxlength="15" autocomplete="off">
          <script>
            (function(){try{
              var pc={};try{pc=JSON.parse(localStorage.getItem('profileCache'))||{};}catch(e){}
              var ni=document.getElementById('input-name');
              var nm=pc.displayName||localStorage.getItem('guestName')||'';
              if(ni&&nm&&!ni.value)ni.value=nm;
              var av=localStorage.getItem('lastProfileAvatar')||localStorage.getItem('guestAvatar')||'';
              if(av&&av.indexOf('data:')===0){var d=document.getElementById('avatar-display');if(d)d.innerHTML='<img src="'+av+'">';}
            }catch(e){}})();
          </script>
        </div>
      </div>

      <!-- Tabs -->
      <div class="section-tabs">
        <button class="tab-btn active" id="tab-create" onclick="switchTab('create')">Créer</button>
        <button class="tab-btn" id="tab-join" onclick="switchTab('join')">Rejoindre</button>
      </div>

      <!-- Créer -->
      <div id="panel-create" class="flex-col gap-12">
        <p class="text-sm">Tu seras l'hôte. Tu choisiras les rôles (nombre de loups, etc.) dans la salle d'attente, une fois tout le monde arrivé.</p>
        <button id="btn-create" class="btn btn-primary"><i class="fas fa-plus-circle"></i> Créer la partie</button>
      </div>

      <!-- Rejoindre -->
      <div id="panel-join" class="flex-col gap-12 hidden">
        <div class="input-group">
          <label>Code de la partie</label>
          <input type="text" id="input-code" class="input input-code" placeholder="ABCD" maxlength="4" autocomplete="off" autocapitalize="characters" inputmode="text">
          <div id="code-hint" class="text-sm" style="text-align:center;height:16px;transition:color .2s"></div>
        </div>
        <button id="btn-join" class="btn btn-gold"><i class="fas fa-sign-in-alt"></i> Rejoindre</button>
      </div>

      <div id="error-msg" class="hidden text-sm text-center" style="color:var(--red)"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script type="module">
    import { auth, db, getFirestore, waitForAuth, withRetry, friendlyError } from '/js/firebase-config.js';
    import { ref, push, set, get, update } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';
    import { onAuthStateChanged, signInAnonymously } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
    import { doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
    import { getGuestName, setGuestName, getGuestAvatar, setGuestAvatar, generateGameCode, setGameSession, showToast } from '/js/game/utils.js';
    import { compressAvatar } from '/js/game/avatar.js';
    import { defaultRoles } from '/js/game/loup.js';

    const authReady = (async () => {
      try { let u = await waitForAuth(); if (!u) u = (await signInAnonymously(auth)).user; return u; }
      catch (e) { console.warn('[auth]', e); return null; }
    })();

    // Paint optimiste : privilégier le vrai avatar du compte (frais, effacé à la
    // déconnexion) plutôt que l'avatar invité qui peut être périmé → évite le flash
    // de l'ancienne photo avant le retour de Firestore.
    let selectedAvatar = '';
    try { selectedAvatar = localStorage.getItem('lastProfileAvatar') || ''; } catch (e) {}
    if (!selectedAvatar) selectedAvatar = getGuestAvatar() || '';

    function showAvatarPreview(avatar) {
      const d = document.getElementById('avatar-display');
      if (avatar && avatar.startsWith('data:')) d.innerHTML = `<img src="${avatar}">`;
      else d.textContent = '📸';
    }
    showAvatarPreview(selectedAvatar);

    document.getElementById('photo-input').addEventListener('change', async (e) => {
      const file = e.target.files[0]; if (!file) return;
      try { const b64 = await compressAvatar(file); selectedAvatar = b64; setGuestAvatar(b64); showAvatarPreview(b64); }
      catch { showToast('Erreur chargement photo', 'error'); }
      e.target.value = '';
    });

    let _codeTimer = null;
    document.getElementById('input-code').addEventListener('input', (e) => {
      const code = e.target.value.trim().toUpperCase();
      const hint = document.getElementById('code-hint');
      clearTimeout(_codeTimer);
      if (code.length < 4) { hint.textContent = ''; return; }
      hint.textContent = '…'; hint.style.color = 'var(--text-muted)';
      _codeTimer = setTimeout(async () => {
        try {
          await authReady;
          const snap = await withRetry(() => get(ref(db, `loupCodes/${code}`)), { retries: 3, base: 400 });
          if (snap.exists()) { hint.textContent = 'Partie trouvée'; hint.style.color = 'var(--orange)'; }
          else { hint.textContent = 'Code introuvable'; hint.style.color = 'var(--red)'; }
        } catch { hint.textContent = 'Réseau instable, réessaie'; hint.style.color = 'var(--red)'; }
      }, 400);
    });

    const nameInput = document.getElementById('input-name');
    if (!nameInput.value) nameInput.value = getGuestName();

    onAuthStateChanged(auth, async (user) => {
      if (user && !user.isAnonymous) {
        try {
          const firestore = await getFirestore();
          const snap = await withRetry(() => getDoc(doc(firestore, 'users', user.uid)), { retries: 3 });
          if (snap.exists()) {
            const data = snap.data();
            nameInput.value = data.displayName || user.displayName || '';
            if (data.avatar) {
              selectedAvatar = data.avatar;
              showAvatarPreview(data.avatar);
              // Rafraîchir les caches pour un affichage instantané la prochaine fois
              try { localStorage.setItem('lastProfileAvatar', data.avatar); } catch (e) {}
              setGuestAvatar(data.avatar);
            }
          }
        } catch (e) { console.warn('[profil]', e); }
      }
    });

    window.switchTab = (tab) => {
      document.getElementById('panel-create').classList.toggle('hidden', tab !== 'create');
      document.getElementById('panel-join').classList.toggle('hidden', tab !== 'join');
      document.getElementById('tab-create').classList.toggle('active', tab === 'create');
      document.getElementById('tab-join').classList.toggle('active', tab === 'join');
    };

    function getPlayerInfo() {
      const name = nameInput.value.trim();
      if (!name) { showError('Entre un pseudo !'); return null; }
      setGuestName(name);
      return { name, avatar: selectedAvatar || '🎴' };
    }
    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = msg; el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 4000);
    }

    // --- Créer ---
    document.getElementById('btn-create').onclick = async () => {
      const player = getPlayerInfo(); if (!player) return;
      const btn = document.getElementById('btn-create'); btn.disabled = true;
      try {
        let user = await authReady; if (!user) user = (await signInAnonymously(auth)).user;
        const playerId = user.uid;
        const gameCode = generateGameCode();
        const gameRef = push(ref(db, 'loupGames'));
        const gameId = gameRef.key;
        const now = Date.now();
        await withRetry(() => update(ref(db), {
          [`loupCodes/${gameCode}`]: { gameId, createdAt: now },
          [`loupGames/${gameId}`]: {
            gameCode, hostId: playerId, status: 'waiting', phase: null, createdAt: now,
            config: { roles: defaultRoles() },
            players: { [playerId]: { name: player.name, avatar: player.avatar, uid: user.uid, online: true } }
          }
        }));
        setGameSession({ gameId, playerId, isHost: true, ns: 'loupGames' });
        window.location.href = `/loupwait.html?gameId=${gameId}&playerId=${playerId}`;
      } catch (e) { showError(friendlyError(e)); btn.disabled = false; }
    };

    // --- Rejoindre ---
    document.getElementById('btn-join').onclick = async () => {
      const player = getPlayerInfo(); if (!player) return;
      const code = document.getElementById('input-code').value.trim().toUpperCase();
      if (code.length !== 4) return showError('Le code fait 4 caractères');
      const btn = document.getElementById('btn-join'); btn.disabled = true;
      try {
        await authReady;
        const codeSnap = await withRetry(() => get(ref(db, `loupCodes/${code}`)));
        if (!codeSnap.exists()) return (() => { showError('Code incorrect'); btn.disabled = false; })();
        const gameId = codeSnap.val().gameId;
        const gameSnap = await withRetry(() => get(ref(db, `loupGames/${gameId}`)));
        if (!gameSnap.exists()) return (() => { showError('Partie introuvable'); btn.disabled = false; })();
        const game = gameSnap.val();
        if (game.status !== 'waiting') return (() => { showError('La partie a déjà commencé'); btn.disabled = false; })();

        let user = await authReady; if (!user) user = (await signInAnonymously(auth)).user;
        const playerId = user.uid;
        await withRetry(() => set(ref(db, `loupGames/${gameId}/players/${playerId}`), {
          name: player.name, avatar: player.avatar, uid: user.uid, online: true
        }));
        setGameSession({ gameId, playerId, isHost: false, ns: 'loupGames' });
        window.location.href = `/loupwait.html?gameId=${gameId}&playerId=${playerId}`;
      } catch (e) { showError(friendlyError(e)); btn.disabled = false; }
    };
  </script>

</body></html>

<!DOCTYPE html>
<html lang="fr"><head>
  <meta charset="UTF-8">
  <style id="gita-early-bg">html{background:#243242}</style>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#243242">
  <title>Pyramide — La Gitanerie</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="preconnect" href="https://www.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&amp;family=Playfair+Display:wght@700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/main.css">
  <script src="/js/i18n.js"></script>
  <link rel="modulepreload" href="/js/firebase-config.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js">
  <link rel="prefetch" href="/lobbypyramide.html">
  <style>
    .mode-card { display:flex; align-items:center; gap:16px; padding:20px; border:2px solid var(--border); border-radius:var(--radius); background:var(--bg-card); cursor:pointer; transition:border-color var(--transition), transform var(--transition); text-align:left; width:100%; font-family:inherit; color:var(--text); }
    .mode-card:active { transform:scale(.98); }
    /* Au doigt, :hover reste collé après le tap : la carte garde sa bordure de
       couleur alors qu'on ne la touche plus. On garde donc :active pour tout le
       monde, et :hover pour les seuls pointeurs qui survolent vraiment. */
    .mode-card.classic:active { border-color:var(--orange); }
    .mode-card.oral:active { border-color:var(--gold); }
    @media (hover: hover) and (pointer: fine) {
      .mode-card.classic:hover { border-color:var(--orange); }
      .mode-card.oral:hover { border-color:var(--gold); }
    }
    .mode-icon { font-size:2rem; width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .mode-card.classic .mode-icon { background:rgba(231,76,60,.14); color:var(--orange); }
    .mode-card.oral .mode-icon { background:rgba(243,156,18,.14); color:var(--gold); }
    .mode-title { font-size:1.15rem; font-weight:700; }
    .mode-desc { font-size:.82rem; color:var(--text-muted); margin-top:3px; line-height:1.4; }
    .mode-arrow { margin-left:auto; color:var(--text-muted); font-size:1.1rem; flex-shrink:0; }
  </style>
</head>
<body>

  <div class="screen">
    <header class="app-header">
      <button class="header-btn" onclick="window.location.href='/'" data-i18n-aria="common.back" aria-label="Retour"><i class="fas fa-arrow-left"></i></button>
      <div class="header-brand"><i class="fas fa-guitar" style="color:var(--red);margin-right:6px;font-size:.9rem"></i>La <span class="brand-accent">Gitanerie</span></div>
      <div style="width:36px"></div>
    </header>

    <div class="page-content">
      <div class="flex-col gap-4" style="text-align:center;margin-bottom:4px">
        <h2>🔺 La Pyramide</h2>
        <p class="text-sm text-muted" data-i18n="pyr.chooseMode">Choisis ton mode de jeu</p>
      </div>

      <button class="mode-card classic" onclick="window.location.href='/lobbypyramide.html?mode=classic'">
        <div class="mode-icon"><i class="fas fa-mobile-screen-button"></i></div>
        <div style="flex:1">
          <div class="mode-title" data-i18n="mode.classic">Classique</div>
          <div class="mode-desc" data-i18n="mode.classicDesc">Tout se joue sur le téléphone : donner les gorgées, accuser les menteurs, phase mémoire notée.</div>
        </div>
        <div class="mode-arrow">→</div>
      </button>

      <button class="mode-card oral" onclick="window.location.href='/lobbypyramide.html?mode=oral'">
        <div class="mode-icon"><i class="fas fa-champagne-glasses"></i></div>
        <div style="flex:1">
          <div class="mode-title" data-i18n="mode.oral">Soirée</div>
          <div class="mode-desc" data-i18n="mode.oralDesc">Le téléphone montre juste tes cartes ; l'hôte retourne la pyramide carte par carte. Les gorgées se donnent à l'oral.</div>
        </div>
        <div class="mode-arrow">→</div>
      </button>

      <!-- Rejoindre rapidement (parties d'amis en attente) -->
      <div id="quick-join" class="card flex-col gap-10 hidden">
        <h3><i class="fas fa-bolt" style="color:var(--gold)"></i> <span data-i18n="pyr.friendGames">Parties de tes amis</span></h3>
        <div id="quick-join-list" class="flex-col gap-8"></div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script type="module">
    import { auth, db, waitForAuth } from '/js/firebase-config.js';
    import { ref, get, onValue } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';
    import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
    import { avatarHTML } from '/js/game/avatar.js';

    // --- Rejoindre rapidement : parties d'amis en attente (temps réel) ---
    // On écoute chaque activeGames/{ami} en direct : dès qu'un ami crée sa
    // partie, elle apparaît ici sans avoir à quitter/revenir sur la page.
    let _friendUnsubs = [];
    function clearFriendListeners() {
      _friendUnsubs.forEach((u) => { try { u(); } catch (e) {} });
      _friendUnsubs = [];
    }

    async function loadFriendGames(user) {
      const wrap = document.getElementById('quick-join');
      const list = document.getElementById('quick-join-list');
      if (!wrap || !list) return;
      clearFriendListeners();
      let ids = [];
      try { ids = Object.keys((await get(ref(db, `friends/${user.uid}`))).val() || {}); }
      catch (e) { return; }
      if (!ids.length) { wrap.classList.add('hidden'); return; }

      const gamesByFid = {};
      const render = () => {
        const games = Object.values(gamesByFid).filter(Boolean);
        if (!games.length) { list.innerHTML = ''; wrap.classList.add('hidden'); return; }
        list.innerHTML = '';
        games.forEach((g) => {
          const row = document.createElement('div');
          row.className = 'flex items-center gap-12';
          row.innerHTML = `
            ${avatarHTML(g.avatar || '🎴', 40)}
            <div class="flex-col" style="flex:1">
              <span class="font-bold">${g.name || 'Un ami'}</span>
              <span class="text-sm text-muted">Partie en attente · ${g.code}</span>
            </div>`;
          const btn = document.createElement('button');
          btn.className = 'btn btn-gold btn-sm';
          btn.style.width = 'auto';
          btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Rejoindre';
          btn.onclick = () => { window.location.href = `/lobbypyramide.html?join=${g.code}`; };
          row.appendChild(btn);
          list.appendChild(row);
        });
        wrap.classList.remove('hidden');
      };

      ids.forEach((fid) => {
        const unsub = onValue(ref(db, `activeGames/${fid}`), (snap) => {
          const g = snap.val();
          gamesByFid[fid] = (g && g.code) ? g : null;
          render();
        }, () => { gamesByFid[fid] = null; render(); });
        _friendUnsubs.push(unsub);
      });
    }

    onAuthStateChanged(auth, (user) => {
      if (user && !user.isAnonymous) {
        loadFriendGames(user);
      } else {
        clearFriendListeners();
        document.getElementById('quick-join')?.classList.add('hidden');
      }
    });

    // Coupe les écouteurs quand on quitte la page (évite les fuites).
    window.addEventListener('pagehide', clearFriendListeners);
  </script>

</body></html>

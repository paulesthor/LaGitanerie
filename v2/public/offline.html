<!DOCTYPE html>
<html lang="fr"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#243242">
  <title>Hors ligne — La Gitanerie</title>
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/css/main.css">
  <script src="/js/i18n.js"></script>
  <style>
    /* Page volontairement autonome : ni police distante, ni icône distante.
       Elle s'affiche justement quand rien ne peut être téléchargé. */
    .off-wrap { min-height:100dvh; display:flex; flex-direction:column; align-items:center;
      justify-content:center; gap:22px; padding:32px 24px; text-align:center; }
    .off-mark { font-size:3.4rem; line-height:1; }
    .off-h { font-family:var(--font-brand); font-size:1.6rem; font-weight:700; }
    .off-p { color:var(--text-muted); font-size:.95rem; line-height:1.5; max-width:320px; }
    .off-actions { display:flex; flex-direction:column; gap:12px; width:100%; max-width:300px; margin-top:6px; }
  </style>
</head>
<body>
  <div class="off-wrap">
    <div class="off-mark">🍻</div>
    <h1 class="off-h" data-i18n="offline.title">Pas de réseau</h1>
    <p class="off-p" data-i18n="offline.body">Cette page a besoin d'une connexion. Mais la Soirée, elle, se joue sans : un code dit à voix haute suffit.</p>
    <div class="off-actions">
      <a class="btn btn-primary" href="/soiree.html" style="padding:16px" data-i18n="offline.playOffline">Jouer en Soirée hors ligne</a>
      <a class="btn" href="/des.html" style="padding:14px" data-i18n="offline.dice">Lancer les dés</a>
      <button class="btn" id="retry" style="padding:14px" data-i18n="offline.retry">Réessayer</button>
    </div>
  </div>
  <script>
    document.getElementById('retry').onclick = () => location.reload();
    // Dès que le réseau revient, on repart tout seul là où le joueur voulait aller.
    window.addEventListener('online', () => location.replace('/'));
  </script>
</body></html>
